apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: test-service-grpc-api
  namespace: exolve
  description: gRPC API for test-service (Hello and Echo)
  annotations:
   grpc-docs.io/environments: |
      - name: local
        target: 127.0.0.1:50051
        security: insecure
  tags:
    - grpc
    - test-service
    - spine
spec:
  type: grpc-docs
  lifecycle: experimental
  owner: nornir
  system: exolve/spine-services
  definition: |
    syntax = "proto3";

    package testservice;

    option go_package = "git.rnd.mtt/oliwio/spine/test-service/pkg/api";

    // HelloService is a simple service that says hello
    service HelloService {
      // SayHello says hello to the given name
      rpc SayHello(HelloRequest) returns (HelloResponse);
    }

    // HelloRequest is the request for the SayHello method
    message HelloRequest {
      // Name is the name to say hello to
      string name = 1;
    }

    // HelloResponse is the response from the SayHello method
    message HelloResponse {
      // Message is the hello message
      string message = 1;
    }

    // EchoService is a simple service that echoes back the received message
    service EchoService {
      // Echo returns the same message that was sent
      rpc Echo(EchoRequest) returns (EchoResponse);
    }

    // EchoRequest is the request for the Echo method
    message EchoRequest {
      // Message is the text to echo back
      string message = 1;
    }

    // EchoResponse is the response from the Echo method
    message EchoResponse {
      // Message is the echoed text
      string message = 1;
    }
